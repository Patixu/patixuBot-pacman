<!doctype html>
<html>

<head>

    <title>Pac-Man - Mod por Seu Nome</title>

    <!-- Allow page to be saved as web app on iOS. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Hide status bar -->
    <meta names="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- icon used for iOS Web App -->
    <link rel="apple-touch-icon-precomposed" href="icon/ios_icon.png"/>

    <link rel="icon" type="image/png" href="icon/favicon.png"/>

    <style>
        body {
            margin:0;
            background: #000;
        }
        @font-face {
            font-family: 'ArcadeR';
            src: url('font/ARCADE_R.TTF');
        }
        #canvas-warning {
            color: #FF0;
            font-size: 1.5em;
        }
        #sound-toggle {
            position: fixed;
            top: 8px;
            right: 8px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 20px;
            line-height: 1;
            z-index: 10000;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>

    <!--
      CONTROLE DE SOM E RETOMADA — precisa vir ANTES do pacman.js.

      1) Som: o jogo toca com new Audio('sounds/...') (objetos que não ficam na página),
         então interceptamos o play() para conseguir pausar/silenciar tudo depois.
      2) Retomada: o jogo para ao perder o foco (blur) e só volta com o evento focus,
         que a WebView do WhatsApp nem sempre manda. Aqui disparamos o focus ao voltar.
    -->
    <script>
    (function () {
        var medias = [];          // todo áudio que o jogo já tocou
        var pausedByHide = [];    // os que estavam tocando quando a página saiu de cena
        var userMuted = false;    // botão 🔊/🔇
        var hidden = false;       // página escondida / sem foco / fechada
        var stalled = false;      // a tela parou de renderizar (WebView em segundo plano)
        var suspended = false;
        var needsWake = false;    // o jogo pode ter parado e precisa ser reiniciado

        var nativePlay = HTMLMediaElement.prototype.play;

        HTMLMediaElement.prototype.play = function () {
            if (medias.indexOf(this) === -1) medias.push(this);
            this.muted = userMuted;
            if (suspended) return Promise.resolve();
            return nativePlay.apply(this, arguments);
        };

        function playSafely(media) {
            var result = nativePlay.call(media);
            if (result && result.catch) result.catch(function () {});
        }

        function suspend() {
            if (suspended) return;
            suspended = true;
            pausedByHide = medias.filter(function (m) { return !m.paused; });
            pausedByHide.forEach(function (m) { m.pause(); });
        }

        function resume() {
            if (!suspended) return;
            suspended = false;
            pausedByHide.forEach(playSafely);
            pausedByHide = [];
        }

        function apply() {
            if (hidden || stalled) suspend(); else resume();
        }

        function applyMute() {
            medias.forEach(function (m) { m.muted = userMuted; });
        }

        // Faz o jogo reiniciar o loop: o executive do pacman.js escuta "focus" e chama start()
        // (que é ignorado se o jogo já está rodando, então chamar a mais não faz mal).
        function wake() {
            window.dispatchEvent(new Event('focus'));
        }

        // 1) Sai de cena: troca de app, tela bloqueada, WebView fechada, perda de foco.
        function onHide() {
            hidden = true;
            needsWake = true;
            apply();
        }

        function onShow() {
            hidden = document.hidden;
            apply();
            if (!hidden) wake();
        }

        document.addEventListener('visibilitychange', function () {
            if (document.hidden) onHide(); else onShow();
        });
        window.addEventListener('pagehide', onHide);
        window.addEventListener('pageshow', onShow);
        window.addEventListener('blur', onHide);
        document.addEventListener('freeze', onHide);
        document.addEventListener('resume', onShow);

        // Evento "focus" real (ou o que disparamos): só atualiza o estado, sem recursão.
        window.addEventListener('focus', function () {
            hidden = document.hidden;
            apply();
        });

        // 2) Vigia: se a tela parar de renderizar por mais de 1,5 s (WebView escondida
        //    sem disparar evento nenhum), silencia. Quando voltar a renderizar, retoma
        //    o som e reinicia o jogo.
        var lastBeat = performance.now();
        (function beat() {
            lastBeat = performance.now();
            requestAnimationFrame(beat);
        })();
        setInterval(function () {
            var isStalled = performance.now() - lastBeat > 1500;
            if (isStalled !== stalled) {
                stalled = isStalled;
                if (stalled) {
                    needsWake = true;
                } else {
                    hidden = document.hidden;
                    wake();
                }
                apply();
            }
        }, 500);

        // 3) Último recurso: o primeiro toque depois de voltar reinicia o jogo.
        ['pointerdown', 'touchstart'].forEach(function (name) {
            document.addEventListener(name, function () {
                if (needsWake && !document.hidden) {
                    needsWake = false;
                    hidden = false;
                    apply();
                    wake();
                }
            }, { capture: true, passive: true });
        });

        // 4) Botão 🔊/🔇 (usa a propriedade "muted", então não quebra os loops do jogo).
        document.addEventListener('DOMContentLoaded', function () {
            var button = document.createElement('button');
            button.id = 'sound-toggle';
            button.textContent = '🔊';
            button.setAttribute('aria-label', 'Ligar ou desligar o som');

            button.addEventListener('pointerdown', function (e) {
                e.preventDefault();
                e.stopPropagation();
                userMuted = !userMuted;
                button.textContent = userMuted ? '🔇' : '🔊';
                applyMute();
            });

            document.body.appendChild(button);
        });
    })();
    </script>

<script src="pacman.js"></script>

</head>

<body>

    <div style='font-family: ArcadeR'> </div>
    <canvas id='canvas'><div id="canvas-warning">Your browser does not support HTML Canvas.  Please upgrade!</div></canvas>
    <canvas id='atlas' style="display:none"></canvas>

    <!-- Rodapé personalizado com o seu nome -->
    <div style="
      position: fixed;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-family: sans-serif;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.7);
      padding: 4px 12px;
      border-radius: 12px;
      z-index: 9999;
      pointer-events: none;
    ">
      🎮 Pac-Man • Modificado por <strong>Seu Nome</strong>
    </div>

</body>

</html>
